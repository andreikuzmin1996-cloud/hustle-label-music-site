<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Оставить заявку — HUSTLE LABEL MUSIC</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#101010;color:#fff;margin:0}main{max-width:660px;margin:5vh auto;padding:24px}h1{font-size:clamp(28px,6vw,46px);line-height:1.1}p{color:#b9b9b9;line-height:1.5}label{display:block;margin:18px 0 8px}input,textarea,select{width:100%;padding:15px;background:#1f1f1f;border:1px solid #555;border-radius:7px;color:white;font:inherit}button{border:0;border-radius:7px;background:white;color:#101010;font-weight:700;padding:17px 22px;margin-top:22px;cursor:pointer}button:disabled{opacity:.5}a{color:#ddd}#status{min-height:24px}</style></head><body><main><p><a href="./">← На главную</a></p><h1>ОСТАВИТЬ ЗАЯВКУ</h1><p>HUSTLE LABEL MUSIC — отправь заявку на работу с лейблом, и мы получим её по электронной почте.</p><form id="contact-form" action="https://api.web3forms.com/submit" method="POST"><input type="hidden" name="access_key" value="18f9827c-8452-4537-83f3-a2fde5a44435"><input type="hidden" name="subject" value="Новая заявка — HUSTLE LABEL MUSIC"><input type="hidden" name="from_name" value="HUSTLE LABEL MUSIC"><input type="checkbox" name="botcheck" style="display:none"><label>Имя или псевдоним *</label><input name="name" required maxlength="100"><label>Контакт для ответа *</label><input name="contact" required maxlength="150" placeholder="Телеграм, email или телефон"><label>Услуга</label><select name="service"><option>Выпуск релиза</option><option>Продвижение музыки</option><option>Оформление артиста</option><option>Другое</option></select><label>Ссылка на трек</label><input name="track" type="url" placeholder="https://"><label>Сообщение</label><textarea name="message" rows="5"></textarea><button type="submit">ОТПРАВИТЬ ЗАЯВКУ ↗</button><p id="status" role="status" aria-live="polite"></p></form></main><script>document.getElementById('contact-form').addEventListener('submit',async function(e){e.preventDefault();const f=e.currentTarget,btn=f.querySelector('button'),status=document.getElementById('status');btn.disabled=true;status.textContent='Отправка…';try{const r=await fetch('https://api.web3forms.com/submit',{method:'POST',body:new FormData(f),headers:{Accept:'application/json'}});const j=await r.json();if(!r.ok||!j.success)throw Error(j.message||'Сервис не принял заявку');status.textContent='Заявка успешно отправлена!';status.style.color='#8cffb0';f.reset()}catch(err){status.textContent='Не удалось отправить: '+err.message;status.style.color='#ffaaaa'}finally{btn.disabled=false}})</script></body></html>
