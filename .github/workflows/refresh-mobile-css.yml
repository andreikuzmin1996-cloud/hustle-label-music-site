name: Embed mobile styles in live HTML
on:
  push:
    paths:
      - '.github/workflows/refresh-mobile-css.yml'
      - 'mobile-enhancements.css'
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Inline responsive CSS and remove obsolete stylesheet links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html')
          s=html.read_text(encoding='utf-8')
          css=Path('mobile-enhancements.css').read_text(encoding='utf-8')
          s=re.sub(r'<style\s+id=["\']hustle-mobile-inline["\']>.*?</style>', '', s, flags=re.S|re.I)
          s=re.sub(r'<link\b[^>]*\bhref=["\']mobile-enhancements\.css(?:\?[^"\']*)?["\'][^>]*>', '', s, flags=re.I)
          patch = '\n<style id="hustle-mobile-inline">\n'+css+'\n</style>\n'
          assert '</head>' in s
          s=s.replace('</head>',patch+'</head>',1)
          html.write_text(s,encoding='utf-8')
          print('Embedded CSS bytes:',len(css),'HTML bytes:',len(s))
          assert 'hustle-mobile-inline' in s
          PY
      - name: Publish changed HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Inline mobile responsive styles in published HTML"
            git push
          fi
