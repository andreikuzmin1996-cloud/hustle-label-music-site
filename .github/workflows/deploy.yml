name: Deploy HUSTLE LABEL MUSIC to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Integrate responsive styles and direct email submission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Original HTML comes from repository; never stack old injected handlers.
          s = s.replace('</head>', '<link rel="stylesheet" href="mobile-enhancements.css?v=10"></head>')
          s = s.replace('</body>', '<script src="form-email.js?v=7"></script></body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
