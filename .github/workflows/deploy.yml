name: Deploy HUSTLE LABEL MUSIC to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Validate Google Search Console verification
        run: |
          test -f index.html
          test -f google0be7c91410ca3220.html
          test -f robots.txt
          test -f sitemap.xml
          grep -Fx 'google-site-verification: google0be7c91410ca3220.html' google0be7c91410ca3220.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
